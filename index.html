<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>OPERATION BLACKOUT</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070a; }
  body { font-family: "Rajdhani", "DIN Alternate", "Bahnschrift", system-ui, sans-serif; cursor:none; }
  /* canvas is a replaced element: inset:0 alone leaves it at its 300x150
     intrinsic size, so the explicit 100%/100% is load-bearing. */
  #game { position:fixed; inset:0; display:block; width:100%; height:100%; }
  #ui-root { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #boot { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
          background:#05070a; color:#c8d4dc; letter-spacing:.35em; font-size:13px; text-transform:uppercase; }
  #boot .bar { position:absolute; bottom:0; left:0; height:2px; width:0%; background:#e8b562; transition:width .2s ease; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-root"></div>
  <div id="boot"><span id="boot-label">Initializing</span><div class="bar" id="boot-bar"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
